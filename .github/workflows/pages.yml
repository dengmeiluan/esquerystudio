name: Demo site

# 演示站随 main 滚动更新自动发布；仍保留手动触发用于补发。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  deployments: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: ui
      - run: npm run build:demo
        working-directory: ui
      - name: Assemble landing site
        run: |
          rm -rf dist/pages
          mkdir -p dist/pages
          cp -r dist/demo dist/pages/demo
          cp -r site/. dist/pages/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      # 初版规范：Deployments 只保留最新一条（滚动更新）。
      - name: Keep a single rolling Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ids=$(gh api "repos/$GITHUB_REPOSITORY/deployments?environment=github-pages&per_page=100" --jq '.[].id' | tail -n +2)
          for id in $ids; do
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/deployments/$id" || true
          done
