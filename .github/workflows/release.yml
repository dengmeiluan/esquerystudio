name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # 本地 stdio MCP 单文件可执行：SEA 复制的是「构建机」的 node 运行时，
  # 所以必须在本平台的 runner 上构建，不能拿 Linux 产物冒充 Windows .exe。
  mcp-exe:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install UI toolchain (esbuild for bundling)
        working-directory: ui
        run: npm ci --no-audit --no-fund
      - name: Build single-file stdio MCP (.exe)
        env:
          ESQ_WIN_SIGN_PFX_BASE64: ${{ secrets.WINDOWS_SIGN_PFX_BASE64 }}
          ESQ_WIN_SIGN_PASSWORD: ${{ secrets.WINDOWS_SIGN_PASSWORD }}
          ESQ_WIN_SIGN_TIMESTAMP_URL: ${{ vars.WINDOWS_SIGN_TIMESTAMP_URL }}
          ESQ_WIN_SIGN_SUBJECT: ${{ vars.WINDOWS_SIGN_SUBJECT }}
        run: node scripts/build-local-mcp-exe.mjs
      - name: Verify artifact contract and real MCP handshake
        env:
          ESQ_REQUIRE_SIGNED: ${{ secrets.WINDOWS_SIGN_PFX_BASE64 != '' }}
        run: node scripts/check-local-mcp-exe.mjs
      - name: Report signature status
        shell: bash
        env:
          ESQ_SIGN_EXPECTED: ${{ secrets.WINDOWS_SIGN_PFX_BASE64 != '' }}
        run: |
          node -e "const m=require('./dist/mcp/esquerystudio-mcp.json'); console.log('signature=' + JSON.stringify(m.signature));"
          STATUS=$(node -e "const m=require('./dist/mcp/esquerystudio-mcp.json'); process.stdout.write(m.signature && m.signature.status || 'missing')")
          if [ "$ESQ_SIGN_EXPECTED" = "true" ] && [ "$STATUS" != "signed" ]; then
            echo "签名证书已配置但构建产物状态为 $STATUS" >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: esquerystudio-mcp-exe
          path: |
            dist/mcp/esquerystudio-mcp.exe
            dist/mcp/esquerystudio-mcp.json
          if-no-files-found: error

  release:
    needs: mcp-exe
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"
          cache: maven

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Validate tag against project versions
        run: |
          VERSION=$(python3 - <<'PY'
          import re
          pom = open("pom.xml", encoding="utf-8").read()
          start = pom.index("<artifactId>esquerystudio</artifactId>")
          print(re.search(r"<version>([^<]+)</version>", pom[start:]).group(1))
          PY
          )
          python3 - "$VERSION" <<'PY'
          import json, re, sys
          version = sys.argv[1]
          for path in ("ui/package.json", "mcp/package.json", "extensions/chrome/manifest.json"):
              declared = json.load(open(path, encoding="utf-8"))["version"]
              if declared != version:
                  raise SystemExit(f"{path}: {declared} != {version}")
          citation = open("CITATION.cff", encoding="utf-8").read()
          declared = re.search(r"^version:\s*(\S+)\s*$", citation, re.MULTILINE).group(1)
          if declared != version:
              raise SystemExit(f"CITATION.cff: {declared} != {version}")
          print(f"version {version}")
          PY
          if [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match project version v$VERSION" >&2
            exit 1
          fi

      - name: Build UI
        working-directory: ui
        run: |
          npm ci --no-audit --no-fund
          npm run build
          npm run build:extension
          npm run build:static

      - name: Verify Chrome extension
        run: node scripts/verify-extension.mjs

      - name: Build Maven release artifacts and SBOM
        run: mvn -B -P release -DskipTests -Dconsole.build.skip=true verify

      # Host embedding jars are profile-only modules; build them separately so a release can be
      # consumed without cloning the repository (boot-support + the shared core it needs).
      - name: Build host embedding jars
        run: mvn -B -Pboot3 -pl modules/boot-support -am -DskipTests -Dconsole.build.skip=true package

      # Runnable host adapter apps: one per supported Spring baseline.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Build Boot 2.7 / 3.5 adapter apps
        run: |
          mvn -B -Pboot2 -pl modules/console-boot2 -am -DskipTests -Dconsole.build.skip=true package
          mvn -B -Pboot3 -pl modules/console-boot3 -am -DskipTests -Dconsole.build.skip=true package
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Build Boot 4.2 adapter app
        run: mvn -B -Pboot4 -pl modules/console-boot4 -am -DskipTests -Dconsole.build.skip=true package
      # Publish the consumable libraries to GitHub Packages (Maven) so hosts can resolve them
      # without cloning the repository. Adapter apps/server jars stay release assets only.
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "8"
      - name: Publish Maven packages to GitHub Packages
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<EOF
          <settings>
            <servers>
              <server>
                <id>github</id>
                <username>${GITHUB_ACTOR}</username>
                <password>${GITHUB_TOKEN}</password>
              </server>
            </servers>
          </settings>
          EOF
          mvn -B -N -DskipTests -DaltDeploymentRepository=github::default::https://maven.pkg.github.com/${GITHUB_REPOSITORY} deploy
          mvn -B -pl platform,modules/es-rest,modules/es-engine,modules/mcp-core,modules/mcp-server,modules/console             -DskipTests -Dconsole.build.skip=true             -DaltDeploymentRepository=github::default::https://maven.pkg.github.com/${GITHUB_REPOSITORY}             deploy
          mvn -B -Pboot3 -pl modules/boot-support             -DskipTests -Dconsole.build.skip=true             -DaltDeploymentRepository=github::default::https://maven.pkg.github.com/${GITHUB_REPOSITORY}             deploy

      - name: Fetch the Windows MCP executable built on windows-latest
        uses: actions/download-artifact@v4
        with:
          name: esquerystudio-mcp-exe
          path: dist/mcp

      - name: Collect release assets
        run: |
          VERSION=$(python3 - <<'PY'
          import re
          pom = open("pom.xml", encoding="utf-8").read()
          start = pom.index("<artifactId>esquerystudio</artifactId>")
          print(re.search(r"<version>([^<]+)</version>", pom[start:]).group(1))
          PY
          )
          mkdir -p dist
          cp "apps/server/target/esquerystudio-server-${VERSION}.jar" dist/
          cp "platform/target/esquerystudio-platform-${VERSION}.jar" dist/
          cp "modules/console/target/esquerystudio-console-${VERSION}.jar" dist/
          # Host form: one dependency plus the shared core it resolves transitively.
          cp "modules/boot-support/target/esquerystudio-boot-support-${VERSION}.jar" dist/
          for m in es-rest es-engine mcp-core mcp-server; do
            cp "modules/${m}/target/esquerystudio-${m}-${VERSION}.jar" dist/
          done
          # Runnable adapters for the three supported Spring baselines.
          cp "modules/console-boot2/target/esquerystudio-console-boot2-${VERSION}.jar" dist/
          cp "modules/console-boot3/target/esquerystudio-console-boot3-${VERSION}.jar" dist/
          cp "modules/console-boot4/target/esquerystudio-console-boot4-${VERSION}.jar" dist/
          for f in platform/target/esquerystudio-platform-${VERSION}-sources.jar \
                   platform/target/esquerystudio-platform-${VERSION}-javadoc.jar \
                   modules/console/target/esquerystudio-console-${VERSION}-sources.jar \
                   modules/console/target/esquerystudio-console-${VERSION}-javadoc.jar; do
            if [ -f "$f" ]; then cp "$f" dist/; fi
          done
          cp target/esquerystudio-sbom.json dist/
          # Windows 单文件 stdio MCP：与 jar/扩展同批发布，客户端配置只需一个路径。
          # 同批带上签名/摘要元数据，用户可核对 signature 与 SHA-256。
          cp dist/mcp/esquerystudio-mcp.exe dist/
          cp dist/mcp/esquerystudio-mcp.json dist/
          # 用仓库的确定性打包脚本剔除 README/store 开发文件，再以发布资产名落盘。
          bash extensions/chrome/package-for-store.sh
          cp "dist/esquerystudio-extension-${VERSION}.zip" "dist/esquerystudio-chrome-${VERSION}.zip"
          if [ -f "dist/esquerystudio-static.zip" ]; then cp "dist/esquerystudio-static.zip" "dist/esquerystudio-static-${VERSION}.zip"; fi

      - name: Checksums
        working-directory: dist
        # dist/ 里除资产外还有 build-static 产出的 esquerystudio-static/ 目录；
        # sha256sum * 遇目录会以 "Is a directory" 退出 1，只对文件求和并排除输出自身。
        run: find . -maxdepth 1 -type f ! -name 'SHA256SUMS' -printf '%P\0' | sort -z | xargs -0 sha256sum > SHA256SUMS

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          # 只对文件做证明；dist/ 里的 esquerystudio-static/ 目录不可作 subject。
          subject-path: |
            dist/*.jar
            dist/*.zip
            dist/*.exe
            dist/esquerystudio-sbom.json

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="ESQueryStudio 查询工作台 · 初版（滚动更新）"
          # dist/ 内另有 build-static 产出的目录，上传只圈资产文件。
          ASSETS=(dist/*.jar dist/*.zip dist/*.exe dist/esquerystudio-mcp.json dist/esquerystudio-sbom.json dist/SHA256SUMS)
          # GitHub API 偶发 502：重试创建；若已建则按唯一事实源覆盖标题/正文并补传资产。
          for attempt in 1 2 3; do
            if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
              echo "Release exists; refreshing metadata from docs/release-body.md and assets."
              gh release edit "$GITHUB_REF_NAME" --title "$TITLE" --notes-file docs/release-body.md && \
                gh release upload "$GITHUB_REF_NAME" "${ASSETS[@]}" --clobber && exit 0
            elif gh release create "$GITHUB_REF_NAME" "${ASSETS[@]}" --verify-tag --notes-file docs/release-body.md --title "$TITLE"; then
              exit 0
            fi
            echo "Release publish attempt $attempt failed; retrying in 15s..." >&2
            sleep 15
          done
          echo "Release publish failed after 3 attempts." >&2
          exit 1

      - name: Verify release metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NAME="$(gh release view "$GITHUB_REF_NAME" --json name --jq .name)"
          test "$NAME" = "ESQueryStudio 查询工作台 · 初版（滚动更新）"
          BODY="$(gh release view "$GITHUB_REF_NAME" --json body --jq .body)"
          printf '%s' "$BODY" | grep -q 'X-Request-Id'

      - name: Prune stale rolling releases and tags
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 滚动发布约定：仓库只保留当前 tag 的 Release 与远程 tag。版本递增后
          # 旧 tag/Release 的清理由本步骤承担（此前依赖人工，残留过 v1.0.66）。
          for r in $(gh api "repos/{owner}/{repo}/releases?per_page=100" --jq '.[].tag_name'); do
            if [ "$r" != "$GITHUB_REF_NAME" ]; then
              rid=$(gh api "repos/{owner}/{repo}/releases?per_page=100" --jq ".[] | select(.tag_name==\"$r\") | .id")
              echo "pruning stale release $r (id=$rid)"
              gh api -X DELETE "repos/{owner}/{repo}/releases/$rid" || echo "WARN: delete release $r failed (continuing)"
            fi
          done
          for t in $(gh api "repos/{owner}/{repo}/tags?per_page=100" --jq '.[].name'); do
            if [ "$t" != "$GITHUB_REF_NAME" ]; then
              echo "pruning stale tag $t"
              git push origin ":refs/tags/$t" || echo "WARN: delete tag $t failed (continuing)"
            fi
          done

      - name: Upload release artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-dist
          path: dist
          retention-days: 7
